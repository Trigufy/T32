name: probe swgt
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe
      - name: Fetch guild history
        run: |
          mkdir -p probe4
          UA="sw-t32.com leaderboard updater (+https://sw-t32.com)"
          get(){ curl -sS -A "$UA" -H "Referer: https://swgt.io/leaderboards/siege/guild/?guildID=427842&server=global" -H "X-Requested-With: XMLHttpRequest" -o "probe4/$1" -w "%{http_code} %{size_download} $1\n" "$2" >> probe4/status.txt || true; sleep 2; }
          get guild_427842.html "https://swgt.io/controllers/leaderboards/ajaxLoadSiegeGuild?guildID=427842&server=global&nocache=$(date +%s%3N)"
          cat probe4/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe4 .github
          git commit -m "probe3 output" || echo nothing
          git push origin HEAD:probe
