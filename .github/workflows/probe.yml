name: probe swgt
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe
      - name: Fetch match history pages
        run: |
          mkdir -p probe3
          UA="sw-t32.com leaderboard updater (+https://sw-t32.com)"
          get(){ curl -sS -A "$UA" -H "Referer: https://swgt.io/leaderboards/siege/" -o "probe3/$1" -w "%{http_code} %{size_download} $1\n" "$2" >> probe3/status.txt || true; sleep 2; }
          get global_now.html "https://swgt.io/controllers/leaderboards/ajaxLoadSiege?date=0&server=global&nocache=$(date +%s%3N)"
          get guild_poison.html "https://swgt.io/leaderboards/siege/guild/?guildID=427842&server=global"
          get map_m11.html "https://swgt.io/leaderboards/siege/map?server=global&matchID=2026100401000011&siegeID=2026100401&guildID1=557458&guildID2=290934&guildID3=427842"
          cat probe3/status.txt
          # follow any ajax loaders the guild page uses
          grep -oE "function_loadServer\('[^']+'" probe3/guild_poison.html | sed -E "s/function_loadServer\('//;s/'$//" | sort -u > probe3/guild_ajax.txt || true
          grep -oE "(url|load)\s*[:(]\s*['\"][^'\"]*controllers[^'\"]*['\"]" probe3/guild_poison.html | sort -u >> probe3/guild_ajax.txt || true
          i=0; while read -r u; do [ -z "$u" ] && continue; i=$((i+1)); case "$u" in /*) full="https://swgt.io$u";; *) full="$u";; esac; get "guild_ajax_$i.html" "$full&nocache=$(date +%s%3N)"; done < probe3/guild_ajax.txt
          cat probe3/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe3 .github
          git commit -m "probe3 output" || echo nothing
          git push origin HEAD:probe
