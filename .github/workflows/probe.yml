name: probe swgt
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe
      - name: Fetch swgt siege page and scripts
        run: |
          set -x
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" -D probe/page.headers -o probe/page.html -w "%{http_code} %{size_download}\n" https://swgt.io/leaderboards/siege/ > probe/page.status || true
          curl -sSL -A "$UA" -o probe/robots.txt https://swgt.io/robots.txt || true
          grep -oiE '(src|href)="[^"]+"' probe/page.html | sed -E 's/^(src|href)="//I;s/"$//' | sort -u > probe/refs.txt || true
          i=0
          while read -r u; do
            case "$u" in
              *.js*|*controllers*|*leaderboard*|*api*)
                case "$u" in
                  http*) full="$u" ;;
                  //*) full="https:$u" ;;
                  /*) full="https://swgt.io$u" ;;
                  *) full="https://swgt.io/leaderboards/siege/$u" ;;
                esac
                case "$full" in
                  *swgt.io*|*cloudfront*) i=$((i+1)); echo "$i $full" >> probe/fetched.txt; curl -sSL -A "$UA" -o "probe/ref_$i.txt" -w "%{http_code} %{size_download} $full\n" "$full" >> probe/fetched.status || true ;;
                esac
              ;;
            esac
          done < probe/refs.txt
          grep -hoiE "[\"'][^\"' ]*(json|controllers|leaderboard|siege|ranking|api)[^\"' ]*[\"']" probe/page.html probe/ref_*.txt 2>/dev/null | sort -u > probe/url_hits.txt || true
          grep -n -iE "ajax|fetch\(|\\\$\.get|\\\$\.post|XMLHttpRequest|getJSON|\.load\(" probe/page.html > probe/ajax_lines.txt || true
          ls -la probe
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "probe output" || echo nothing
          git push origin HEAD:probe
