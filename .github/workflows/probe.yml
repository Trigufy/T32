name: probe swgt
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe
      - name: Fetch siege leaderboard data
        run: |
          mkdir -p probe2
          UA="Mozilla/5.0 (compatible; sw-t32.com updater; +https://sw-t32.com)"
          for s in global europe asiaChina japanKorea; do
            curl -sS -A "$UA" -H "Referer: https://swgt.io/leaderboards/siege/" -H "X-Requested-With: XMLHttpRequest" \
              -o "probe2/$s.html" -w "%{http_code} %{size_download} $s\n" \
              "https://swgt.io/controllers/leaderboards/ajaxLoadSiege?date=0&server=$s&nocache=$(date +%s%3N)" >> probe2/status.txt || true
            sleep 3
          done
          curl -sS -A "$UA" -H "Referer: https://swgt.io/leaderboards/siege/" -o probe2/global_s21.html -w "%{http_code} %{size_download} s21\n" \
            "https://swgt.io/controllers/leaderboards/ajaxLoadSiege?date=20260719&server=global&nocache=$(date +%s%3N)" >> probe2/status.txt || true
          cat probe2/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe2
          git commit -m "probe2 output" || echo nothing
          git push origin HEAD:probe
