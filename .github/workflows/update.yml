name: Update leaderboard from swgt.io

on:
  schedule:
    # swgt.io refreshes after each siege, on Wednesdays and Saturdays. Check every 2 hours those days (UTC),
    # plus a few catch-up checks on Tuesday, Thursday, Friday and Sunday for servers that update early or late.
    - cron: "17 */2 * * 3,6"
    - cron: "47 */6 * * 0,2,4,5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/settings.json"
      - "tools/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull leaderboards from swgt.io
        run: node tools/update.js
      - name: Build pages
        run: node tools/build.js
      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html predictor.html
          git commit -m "Update leaderboard from swgt.io"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo "Pages will rebuild on its own"
